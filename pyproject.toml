[project]
name = "quamina"
version = "0.1.0"
description = "Python wrapper for timbray/quamina"
readme = "README.md"
authors = [
    { name = "Simon Brunning", email = "simon@brunningonline.net" }
]
requires-python = ">=3.14"
dependencies = [
    "arrow>=1.4.0",
    "httpx[http2]>=0.28.1",
    "yarl>=1.22.0",
]

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[project.scripts]
quamina = "quamina:hello"

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "ISC001", "D", "PGH003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "PLR2004", "E501", "ANN", "INP", "FBT001", "FBT002", "S314", "SIM117", "SLF001", "RUF043", "RUF100"]
"examples/*" = ["T201", "INP001", "EXE001"]

[tool.ruff.lint.mccabe]
max-complexity = 5

[tool.pyright]
include = ["src/"]
pythonVersion = "3.14"

[dependency-groups]
dev = [
    "brunns-matchers>=2.11.1",
    "mbtest>=2.14.0",
    "mockito>=1.5.5",
    "pyhamcrest>=2.1.0",
    "pyright>=1.1.408",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "pytest-docker>=3.2.5",
    "ruff>=0.15.1",
]
