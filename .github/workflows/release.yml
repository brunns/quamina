name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-linux:
    name: Build distribution (Linux)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go-quamina/go.mod'

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0

      - name: Set up Python
        run: uv python install 3.14

      - name: Build Go library
        run: |
          cd go-quamina
          make linux
          cp libquamina.so ../src/quamina/lib/

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest tests/unit/ --cov=src/quamina --cov-report=term-missing

      - name: Build package
        run: uv build

      - name: Store the distribution packages
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions-linux
          path: dist/

  build-macos:
    name: Build distribution (macOS)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go-quamina/go.mod'

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0

      - name: Set up Python
        run: uv python install 3.14

      - name: Build Go library
        run: |
          cd go-quamina
          make darwin
          cp libquamina.dylib ../src/quamina/lib/

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest tests/unit/ --cov=src/quamina --cov-report=term-missing

      - name: Build package
        run: uv build

      - name: Store the distribution packages
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions-macos
          path: dist/

  build-windows:
    name: Build distribution (Windows)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go-quamina/go.mod'

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0

      - name: Set up Python
        run: uv python install 3.14

      - name: Build Go library
        run: |
          cd go-quamina
          go build -buildmode=c-shared -o libquamina.dll wrapper.go
          cp libquamina.dll ../src/quamina/lib/

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest tests/unit/ --cov=src/quamina --cov-report=term-missing

      - name: Build package
        run: uv build

      - name: Store the distribution packages
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions-windows
          path: dist/

  publish-to-pypi:
    name: Publish to PyPI
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/quamina
    permissions:
      id-token: write

    steps:
      - name: Download Linux distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions-linux
          path: dist/

      - name: Download macOS distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions-macos
          path: dist/

      - name: Download Windows distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions-windows
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub Release
    needs: publish-to-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Linux distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions-linux
          path: dist/

      - name: Download macOS distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions-macos
          path: dist/

      - name: Download Windows distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions-windows
          path: dist/

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          gh release create
          '${{ github.ref_name }}'
          --repo '${{ github.repository }}'
          --generate-notes

      - name: Upload artifacts to GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          gh release upload
          '${{ github.ref_name }}' dist/**
          --repo '${{ github.repository }}'
